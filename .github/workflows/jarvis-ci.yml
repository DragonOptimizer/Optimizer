name: JARVIS CI

on:
  push:
    branches: [ccr-6abcc165-e5bjdu]
    paths: ['JARVIS-AI/**', '.github/workflows/jarvis-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: JARVIS-AI

jobs:
  windows:
    name: Windows build, tests, installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JARVIS-AI/package-lock.json
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end (real Electron on Windows)
        run: node scripts/e2e-launch.mjs
        env:
          SHOT_DIR: ${{ runner.temp }}\shots
        continue-on-error: true
      - name: Build Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-installer
          path: JARVIS-AI/release/JARVIS-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-windows
          path: ${{ runner.temp }}\shots
          if-no-files-found: ignore

  linux:
    name: Linux tests and Electron e2e (xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JARVIS-AI/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb libgbm1 libasound2t64 libnss3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          JARVIS_TEST_BROWSER: /usr/bin/google-chrome
      - run: npm run build
      - run: xvfb-run -a node scripts/e2e-launch.mjs
        env:
          SHOT_DIR: /tmp/shots
